<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6c63ff">

    <title>Daniel's World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <h1>🌟 Daniel's World 🌟</h1>

        <div class="games">

            <button class="game-button animals">
                <span class="icon">🐶</span>
                <span>Eläimet</span>
            </button>

            <button class="game-button football">
                <span class="icon">⚽</span>
                <span>Jalkapallo</span>
            </button>

            <button class="game-button balloons">
                <span class="icon">🎈</span>
                <span>Ilmapallot</span>
            </button>

            <button class="game-button cars">
                <span class="icon">🚗</span>
                <span>Autot</span>
            </button>

            <button class="game-button puzzle">
                <span class="icon">🧩</span>
                <span>Palapeli</span>
            </button>

            <button class="game-button colors">
                <span class="icon">🔴</span>
                <span>Värit</span>
            </button>

            <button class="game-button letters">
                <span class="icon">🔤</span>
                <span>Kirjaimet</span>
            </button>

            <button class="game-button fruits">
                <span class="icon">🍎</span>
                <span>Hedelmät</span>
            </button>

            <button class="game-button construction">
                <span class="icon">🚜</span>
                <span>Työmaa</span>
            </button>

        </div>

    </main>

</body>
</html>
